name: flood-lakehouse

services:
  postgres:
    image: postgres:17.11-bookworm
    mem_limit: 512m
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_DB: lakehouse
      POSTGRES_PASSWORD: ${LAKEHOUSE_POSTGRES_PASSWORD:?run make lakehouse-init}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run make lakehouse-init}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD:?run make lakehouse-init}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./dataset/lakehouse/postgres:/var/lib/postgresql/data:Z
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-multiple-databases.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d lakehouse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [lakehouse]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./dataset/lakehouse/minio:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [lakehouse]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/raw
        mc mb --ignore-existing local/warehouse
    restart: "no"
    networks: [lakehouse]

  polaris:
    image: apache/polaris:1.7.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "10"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:?run make lakehouse-init}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,${POLARIS_CLIENT_ID:?run make lakehouse-init},${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      'polaris.features."ALLOW_INSECURE_STORAGE_TYPES"': "true"
      'polaris.features."ALLOW_SETTING_S3_ENDPOINTS"': "true"
      'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"': '["S3"]'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run make lakehouse-init}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
      AWS_ENDPOINT_URL_S3: http://minio:9000
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8182/q/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [lakehouse]

  polaris-bootstrap:
    image: alpine/curl:8.21.0
    user: root
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?run make lakehouse-init}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
    volumes:
      - ./infra/polaris/bootstrap.sh:/bootstrap.sh:ro,Z
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache jq >/dev/null && exec /bootstrap.sh"]
    restart: "no"
    networks: [lakehouse]

networks:
  lakehouse:
    driver: bridge
