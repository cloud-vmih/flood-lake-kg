name: flood-lakehouse

services:
  postgres:
    image: postgres:17.11-bookworm
    mem_limit: 512m
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_DB: lakehouse
      POSTGRES_PASSWORD: ${LAKEHOUSE_POSTGRES_PASSWORD:?run make lakehouse-init}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run make lakehouse-init}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD:?run make lakehouse-init}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./dataset/lakehouse/postgres:/var/lib/postgresql/data:Z
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-multiple-databases.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d lakehouse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [lakehouse]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./dataset/lakehouse/minio:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [lakehouse]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/raw
        mc mb --ignore-existing local/warehouse
    restart: "no"
    networks: [lakehouse]

networks:
  lakehouse:
    driver: bridge
