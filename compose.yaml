name: flood-lakehouse

x-airflow-common: &airflow-common
  image: flood-lakehouse-airflow:3.3.1-python3.11
  build:
    context: .
    dockerfile: infra/docker/airflow/Dockerfile
    args:
      AIRFLOW_VERSION: "3.3.1"
  user: "${AIRFLOW_UID:?run make lakehouse-init}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:?run make lakehouse-init}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make lakehouse-init}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_SECRET_KEY:?run make lakehouse-init}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?run make lakehouse-init}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__DAG_CACHE_SIZE: "16"
    AIRFLOW__API__DAG_CACHE_TTL: "1800"
    POLARIS_URI: http://polaris:8181/api/catalog
    POLARIS_CATALOG: flood_lakehouse
    POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?run make lakehouse-init}
    POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
    FLASHFLOOD_PROJECT_ROOT: /opt/flashflood
    FLASHFLOOD_STAGING_ROOT: /opt/airflow/staging
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run make lakehouse-init}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    AWS_REGION: us-east-1
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro,Z
    - ./airflow/plugins:/opt/airflow/plugins:ro,Z
    - ./dataset:/opt/flashflood/dataset:Z
    - ./config:/opt/flashflood/config:ro,Z
    - ${LAKEHOUSE_DATA_ROOT:-./dataset/lakehouse}/staging:/opt/airflow/staging:Z
    - ${LAKEHOUSE_DATA_ROOT:-./dataset/lakehouse}/airflow/logs:/opt/airflow/logs:Z
  networks: [lakehouse]

x-spark-image: &spark-image
  image: flood-lakehouse-spark:4.1.3-iceberg1.11.0
  build:
    context: infra/docker/spark
    dockerfile: Dockerfile
    args:
      SPARK_VERSION: "4.1.3"
      ICEBERG_VERSION: "1.11.0"

services:
  postgres:
    image: postgres:17.11-bookworm
    mem_limit: 512m
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_DB: lakehouse
      POSTGRES_PASSWORD: ${LAKEHOUSE_POSTGRES_PASSWORD:?run make lakehouse-init}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run make lakehouse-init}
      POLARIS_DB_PASSWORD: ${POLARIS_DB_PASSWORD:?run make lakehouse-init}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${LAKEHOUSE_DATA_ROOT:-./dataset/lakehouse}/postgres:/var/lib/postgresql/data:Z
      - ./infra/services/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-multiple-databases.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d lakehouse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [lakehouse]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${LAKEHOUSE_DATA_ROOT:-./dataset/lakehouse}/minio:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [lakehouse]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/raw
        mc mb --ignore-existing local/warehouse
    restart: "no"
    networks: [lakehouse]

  polaris-db-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:?run make lakehouse-init}
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,${POLARIS_CLIENT_ID:?run make lakehouse-init},${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
    restart: "no"
    networks: [lakehouse]

  polaris:
    image: apache/polaris:1.7.0
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      polaris-db-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "10"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:?run make lakehouse-init}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,${POLARIS_CLIENT_ID:?run make lakehouse-init},${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      'polaris.readiness.ignore-severe-issues': "true"
      'polaris.features."ALLOW_INSECURE_STORAGE_TYPES"': "true"
      'polaris.features."ALLOW_SETTING_S3_ENDPOINTS"': "true"
      'polaris.features."DROP_WITH_PURGE_ENABLED"': "true"
      'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"': '["S3"]'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run make lakehouse-init}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
      AWS_ENDPOINT_URL_S3: http://minio:9000
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8182/q/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [lakehouse]

  polaris-bootstrap:
    image: flood-lakehouse-polaris-bootstrap:8.21.0
    build:
      context: .
      dockerfile: infra/docker/polaris-bootstrap/Dockerfile
    user: root
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?run make lakehouse-init}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
    volumes:
      - ./infra/services/polaris/bootstrap.sh:/bootstrap.sh:ro,Z
    entrypoint: ["/bootstrap.sh"]
    restart: "no"
    networks: [lakehouse]

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?run make lakehouse-init}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run make lakehouse-init}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json, os, sys; users=json.load(sys.stdin); sys.exit(not any(user.get("username") == os.environ["AIRFLOW_ADMIN_USERNAME"] for user in users))'; then
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Local \
            --lastname Admin \
            --role Admin \
            --email admin@localhost
        fi
        airflow pools set source_landing_writer 1 "Serializes local catalog and Iceberg writers"
        airflow pools set bronze_writer 1 "Serializes Bronze Iceberg writers"
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    mem_limit: 768m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    mem_limit: 1g
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    mem_limit: 512m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trino:
    image: trinodb/trino:483
    profiles: [query]
    mem_limit: 2g
    depends_on:
      polaris:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TRINO_CATALOG_DIR: /etc/trino/catalog
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_CATALOG: flood_lakehouse
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?run make lakehouse-init}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make lakehouse-init}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
    volumes:
      - ./infra/services/trino/render_catalog.sh:/opt/trino/render_catalog.sh:ro,Z
    entrypoint:
      - /bin/sh
      - -c
      - sh /opt/trino/render_catalog.sh && exec /usr/lib/trino/bin/launcher run --etc-dir /etc/trino
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    networks: [lakehouse]

  spark-master:
    <<: *spark-image
    profiles: [spark]
    mem_limit: 768m
    entrypoint: [/opt/spark/bin/spark-class]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.create_connection(("spark-master", 7077), 2).close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [lakehouse]

  spark-worker:
    <<: *spark-image
    profiles: [spark]
    mem_limit: 2560m
    depends_on:
      spark-master:
        condition: service_healthy
    entrypoint: [/opt/spark/bin/spark-class]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run make lakehouse-init}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:8082:8081"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8081", timeout=2).close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [lakehouse]

  spark-submit:
    <<: *spark-image
    profiles: [spark]
    mem_limit: 1536m
    entrypoint: [/opt/spark/bin/spark-submit]
    environment:
      POLARIS_URI: http://polaris:8181/api/catalog
      POLARIS_CATALOG: flood_lakehouse
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:?run make lakehouse-init}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:?run make lakehouse-init}
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run make lakehouse-init}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run make lakehouse-init}
      AWS_REGION: us-east-1
    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro,Z
    restart: "no"
    networks: [lakehouse]

networks:
  lakehouse:
    driver: bridge
