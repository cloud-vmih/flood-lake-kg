contract_version: "2.0"
source_id: gsmap
source_version: v8
provider: gsmap
schedule: "7,37 * * * *"
aoi_path: dataset/harmonized/aoi/hydrological_aoi.geoparquet
grid_scope_path: dataset/harmonized/aoi/vietnam_hydrological_aoi.geoparquet
spatial_scope_name: sonla-l12-h1
retention_class: transient_7d
retention_days: 7
parser_version: gsmap-raster-slice-v2
license_id: jaxa-gsmap-terms
license_uri: https://sharaku.eorc.jaxa.jp/GSMaP/guide.html
max_objects_per_run: 336
task_batch_size: 48
bronze_task_batch_size: 48
streams:
  - stream_id: gauge_now
    product: gauge_now_v8
    start_at: 2026-01-01T00:00:00Z
    step_minutes: 30
    chunk_minutes: 60
    availability_lag_minutes: 60
    overlap_steps: 12
    variables: [precipitation]
    media_type: application/gzip
    filename_suffix: .dat.gz
    endpoint_env: GSMAP_NOW_URL_TEMPLATE
    credential_env: [GSMAP_USERNAME, GSMAP_PASSWORD]
    options:
      grid_resolution_degrees: 0.1
      value_kind: preceding_hour_sum
      dtype: "<f4"
      grid_height: 1200
      grid_width: 3600
      grid_north: 60.0
      grid_west: 0.0
      missing_values: [-4.0, -8.0, -99.0]
