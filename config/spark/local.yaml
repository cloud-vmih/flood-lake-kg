runtime:
  spark: "4.1.3"
  scala: "2.13"
  java: "17"
  iceberg: "1.11.0"
  sedona: "1.9.1"
  geotools: "1.9.1-33.5"
resources:
  driver_memory: 1g
  executor_memory: 2g
  executor_cores: 2
  shuffle_partitions: 8
catalog:
  name: flood_lakehouse
  warehouse: flood_lakehouse
  endpoint_env:
    catalog_uri: POLARIS_URI
    minio_endpoint: MINIO_ENDPOINT
application_timeout_seconds: 3600
